version: 2
updates:
  - package-ecosystem: "github-actions"
    groups:
      github-actions:
        patterns:
          - '*'
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
