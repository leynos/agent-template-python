name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MARKDOWNLINT_CLI2_VERSION: 0.22.1
  MBAKE_VERSION: 1.4.6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Set up Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@57a33fa65e329db7edc81ece661f1a2e1d39868f
        with:
          toolchain: stable

      - name: Install template test tools
        run: |
          npm install -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
          uv tool install "mbake==${MBAKE_VERSION}"

      - name: Run template tests
        run: make test

      - name: Check spelling
        run: make spelling
