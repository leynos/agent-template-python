name: Act Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  act-validation:
    runs-on: ubuntu-latest
    env:
      ACT_VERSION: v0.2.84
      MBAKE_VERSION: 1.4.6
      WHITAKER_INSTALLER_VERSION: 0.2.6
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@4d696e72fff6db49f34302ccf119ba978f1032c9
        with:
          toolchain: stable

      - name: Install Whitaker for rendered Rust projects
        env:
          RUSTFLAGS: ""
        run: |
          cargo binstall --no-confirm --locked \
            whitaker-installer@"${WHITAKER_INSTALLER_VERSION}"
          whitaker-installer --cranelift

      - name: Install template test tools
        run: |
          act_archive=act_Linux_x86_64.tar.gz
          act_url="https://github.com/nektos/act/releases/download/${ACT_VERSION}/${act_archive}"
          curl -fsSLo "${act_archive}" "${act_url}"
          act_sha256="$(
            curl -fsSL "https://api.github.com/repos/nektos/act/releases/tags/${ACT_VERSION}" |
              python -c 'import json, sys; release = json.load(sys.stdin); print(next(asset["digest"].split(":", 1)[1] for asset in release["assets"] if asset["name"] == "act_Linux_x86_64.tar.gz"))'
          )"
          printf '%s  %s\n' "${act_sha256}" "${act_archive}" | sha256sum -c -
          sudo tar -xzf "${act_archive}" -C /usr/local/bin act
          uv tool install "mbake==${MBAKE_VERSION}"

      - name: Check Docker runtime
        run: docker info

      - name: Run template tests with act validation
        env:
          ACT_GITHUB_TOKEN: ${{ github.token }}
        run: make test WITH_ACT=1

      - name: Lint Markdown
        # The upstream action rather than an npm installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the pin
        # alongside the other actions, as the estate
        # `markdown-formatting-baseline` rule requires. The action reads
        # .markdownlint-cli2.jsonc from the workspace, so its rules and ignores
        # match `make fmt`.
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: '**/*.md'
