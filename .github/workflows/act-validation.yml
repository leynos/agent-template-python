name: Act Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  act-validation:
    # Ubicloud, to avoid the hosted queue: the hosted wait was a median of
    # 224 s and a p90 of 1,421 s over six runs after 2026-09-24 (jobs API).
    # standard-4 for its disk: act's images filled standard-2's disk
    # (run 36412276804). A pull request from a fork cannot obtain an
    # Ubicloud runner, so it falls back to the hosted pool. The push to main
    # runs here too, so main writes the Ubicloud cache scope this reads.
    # Dependabot pull requests run on the hosted pool too (free on a public
    # repository). The author is tested, not the actor, which changes when
    # someone else pushes to the branch.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    # An Ubicloud runner is a self-hosted just-in-time runner with no
    # six-hour hosted cap, so the job states its own ceiling: twice the
    # hosted p90 of 20.8 min over ten runs to 2026-09-27 (jobs API).
    timeout-minutes: 45
    env:
      ACT_VERSION: v0.2.84
      MBAKE_VERSION: 1.4.6
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Go for Actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          toolchain: stable

      - name: Install Whitaker for rendered Rust projects
        uses: leynos/shared-actions/.github/actions/install-whitaker@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          cranelift: true

      - name: Install template test tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          act_archive=act_Linux_x86_64.tar.gz
          act_url="https://github.com/nektos/act/releases/download/${ACT_VERSION}/${act_archive}"
          curl -fsSLo "${act_archive}" "${act_url}"
          act_sha256="$(
            curl -fsSL --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/nektos/act/releases/tags/${ACT_VERSION}" |
              python -c 'import json, sys; release = json.load(sys.stdin); print(next(asset["digest"].split(":", 1)[1] for asset in release["assets"] if asset["name"] == "act_Linux_x86_64.tar.gz"))'
          )"
          printf '%s  %s\n' "${act_sha256}" "${act_archive}" | sha256sum -c -
          sudo tar -xzf "${act_archive}" -C /usr/local/bin act

      - name: Install documentation tooling
        run: |
          uv tool install "mbake==${MBAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          npm install -g @action-validator/core@0.6.0 @action-validator/cli@0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install mdtablefix
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          version: '0.6.1'

      - name: Check Docker runtime
        run: docker info

      - name: Run template tests with act validation
        env:
          ACT_GITHUB_TOKEN: ${{ github.token }}
          ACT_EVIDENCE_DIR: ${{ runner.temp }}/act-evidence
        run: make test WITH_ACT=1

      - name: Upload Act diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: act-diagnostic-logs
          path: |
            ${{ runner.temp }}/act-evidence/pure-artefacts/act.log
            ${{ runner.temp }}/act-evidence/rust-artefacts/act.log
          if-no-files-found: warn

      - name: Upload Act coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: act-coverage-evidence
          path: |
            ${{ runner.temp }}/act-evidence/pure-artefacts/coverage.xml
            ${{ runner.temp }}/act-evidence/rust-artefacts/coverage.xml
          if-no-files-found: error

      - name: Lint Markdown
        # The upstream action rather than an npm installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the pin
        # alongside the other actions, as the estate
        # `markdown-formatting-baseline` rule requires. The action reads
        # .markdownlint-cli2.jsonc from the workspace, so its rules and ignores
        # match `make fmt`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
